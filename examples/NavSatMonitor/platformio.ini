; UbxPvt example: decoding UBX-NAV-SAT through the generic onFrame() handler.
; ESP32-S3 + u-blox GNSS on UART1 (GPS TX on GPIO2).
; Build / flash from this directory:
;   pio run -t upload
;   pio device monitor

[env:esp32-s3-devkitc1-n16r16]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r16
framework = arduino
monitor_speed = 115200
build_flags = -I../../src
